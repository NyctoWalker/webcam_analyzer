version: "3.8"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: usr
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: webcam_stats
    ports:
      - "1984:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
